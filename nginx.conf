server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;
    set $service_url http://172.27.0.4:3000;

    location / {
        root   /usr/share/nginx/html;
        add_header Access-Control-Allow-Origin *;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        try_files $uri $uri/ =404;
    }
    # 修复 docs 路径配置
    location /docs {
        alias /usr/share/nginx/html/docs/;
        index index.html index.htm;
        try_files $uri $uri/ =404;   
    }
    location  /subapp/vue2 {
        root /usr/share/nginx/html; 
        index  index.html index.htm;
        try_files $uri $uri/ /subapp/vue2/index.html;
    }
    location  /subapp/vue3 {
        root /usr/share/nginx/html; 
        index  index.html index.htm;
        try_files $uri $uri/ /subapp/vue3/index.html;
    }
    location  /subapp/react {
        root /usr/share/nginx/html; 
        index  index.html index.htm;
        try_files $uri $uri/ /subapp/react/index.html;
    }
    location  /subapp/angular {
        root /usr/share/nginx/html; 
        index  index.html index.htm;
        try_files $uri $uri/ /subapp/angular/index.html;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
    location /api {
      proxy_pass $service_url$request_uri;  # 保留 /api
      # WebSocket 支持
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      # 其他必要的 header
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      proxy_connect_timeout 6000s;
      proxy_send_timeout 6000s;
      proxy_read_timeout 6000s;
      proxy_buffering off;

       # 添加 WebSocket 相关头部
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        
        # 允许跨域
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers '*';
  }
}
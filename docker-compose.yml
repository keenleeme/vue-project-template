version: '3'

services:
  nginx:
    image: docker.das-security.cn/nginx:latest
    container_name: vue-template-nginx
    restart: always
    ports:
      - "8089:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./dist:/usr/share/nginx/html
      - ./docs:/usr/share/nginx/html/docs
    networks:                      
      - das-readdy-network

networks:                          
  das-readdy-network:
    external: true